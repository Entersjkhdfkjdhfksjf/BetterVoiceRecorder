name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # No gradlew wrapper jar is checked into this repo (it's a binary this
      # workflow can't generate), so Gradle is invoked directly instead of
      # via ./gradlew. setup-gradle above provisions it.
      - name: Assemble debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # NOTE: this target/profile combination for a Wear OS system image is
      # unverified against reactivecircus/android-emulator-runner — if the
      # emulator fails to boot, check that action's docs for the currently
      # supported Wear target names.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86_64
          profile: wear_round
          script: ./gradlew connectedDebugAndroidTest
